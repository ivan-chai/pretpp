apply_cls_to_tokens: all
cls_token: null

metric:
  _target_: pretpp.metrics.DownstreamMetric
  classification_fields:
    - target_flag

detection_k: 32

data_module:
  batch_size: 32

module:
  loss_projection_partial:
    _target_: pretpp.nn.CatHead
    _partial_: true
    head_partials:
      - _target_: pretpp.nn.MultiHead  # labels.
        _partial_: true
        head_partial:
          _target_: hotpp.nn.ConditionalHead
          _partial_: true
          hidden_dims: [128]
          k: ${detection_k}
          output_size_per_query: true
        head_output_sizes:
          _presence: 1
          labels: ${num_classes}
          timestamps: 1
          currency: 68
          channel_type: 7
          trx_category: 11
          log_amount: 1
      - _target_: hotpp.nn.Head  # downstream.
        _partial_: true
        output_size: ${num_downstream_classes}
        hidden_dims: [128]
  loss:
    _target_: pretpp.losses.HybridLoss
    prediction_loss: 1
    losses:
      - _target_: pretpp.losses.DeTPPLoss
        k: ${detection_k}
        horizon: 7  # week.
        loss_subset: 0.5
        prefetch_factor: 1
        categorical_fields:
          - labels
          - currency
          - channel_type
          - trx_category
        next_item_adapter:
          timestamps: mode
          labels: mean
          currency: mean
          channel_type: mean
          trx_category: mean
          log_amount: mean
        match_weights:
          _presence: 8
          timestamps: 1.0
          labels: 2.0
          channel_type: 0.5
          currency: 0.5
          trx_category: 1.0
          log_amount: 1.0
        next_item_loss:
          _target_: hotpp.losses.NextItemLoss
          losses:
            _presence:
              _target_: hotpp.losses.BinaryCrossEntropyLoss
              grad_scale: null
            timestamps:
              _target_: hotpp.losses.TimeMAELoss
              delta: start
              max_delta: ${max_duration}
              smoothing: 1
              grad_scale: null
            labels:
              _target_: hotpp.losses.CrossEntropyLoss
              num_classes: ${num_classes}
            currency:
              _target_: hotpp.losses.CrossEntropyLoss
              num_classes: 68
              grad_scale: null
            channel_type:
              _target_: hotpp.losses.CrossEntropyLoss
              num_classes: 7
              grad_scale: null
            trx_category:
              _target_: hotpp.losses.CrossEntropyLoss
              num_classes: 11
              grad_scale: null
            log_amount:
              _target_: hotpp.losses.MAELoss
              grad_scale: null
      - _target_: pretpp.losses.ClassificationLoss
        drop_nans: true
        apply_to_tokens: ${apply_cls_to_tokens}
        cls_token: ${cls_token}
        targets:
          target_flag:
            num_classes: ${num_downstream_classes}
            cast: true
    aggregator:
      _target_: hotpp.nn.LastAggregator
