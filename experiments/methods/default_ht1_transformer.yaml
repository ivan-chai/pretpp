defaults:
  - default_transformer
  - _self_

module:
  seq_encoder:
    model_partial:
      _target_: pretpp.nn.HistoryTokenTransformer
      embed_layer: all
      strategy_partial:
        _target_: pretpp.nn.SingleHTStrategy
        _partial_: true
        apply_probability: ${transformer_history_token_probability}
        token_selection: last
  aggregator: null
