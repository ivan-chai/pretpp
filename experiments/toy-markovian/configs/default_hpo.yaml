defaults:
  - mtl_loss
  - _self_

module:
  _target_: pretpp.modules.HPOModule
  hpo_losses:
    - loss_0_timestamps
    - loss_0_labels
  hp_group_params:
    lr: 0.01
    betas: [0, 0.99]
  hpo_params:
    algorithm: sgd
    scale_gradients: 0.3
  downstream_loss: loss_1_target

trainer:
  precision: 32-true
