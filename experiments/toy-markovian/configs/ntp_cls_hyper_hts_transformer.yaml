defaults:
  - default
  - default_hts_transformer
  - default_hyper
  - _self_

name: ntp_cls_hyper_hts_transformer

apply_cls_to_tokens: all  # or "last" / "special".
transformer_history_token_probability: 1

module:
  seq_encoder:
    model_partial:
      strategy_partial:
        predict: all
      val_strategy_partial:
        _target_: pretpp.nn.LastHTStrategy
        _partial_: true
        predict: all
