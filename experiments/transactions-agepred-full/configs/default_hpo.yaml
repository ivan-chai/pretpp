defaults:
  - mtl_loss
  - _self_

module:
  _target_: pretpp.modules.HPOModule
  hpo_losses:
    - loss_0_timestamps
    - loss_0_labels
    - loss_0_log_amount
  hp_group_params:
    lr: 0.01
    betas: [0, 0.99]
  hpo_params:
    algorithm: sgd
  lr_scheduler_partial:
    gamma: 0.65
  downstream_loss: loss_1_target

trainer:
  precision: 32-true
  strategy: ddp_find_unused_parameters_true
